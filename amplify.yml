version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install "$(cat ../.nvmrc)"
            - nvm use "$(cat ../.nvmrc)"
            - npm ci --prefix ..
            - npm run install:packages --prefix ..
        build:
          commands:
            - export VITE_APP_VERSION="${AWS_BRANCH}-$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-local} | cut -c1-7)"
            - npm run validate --prefix ..
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
